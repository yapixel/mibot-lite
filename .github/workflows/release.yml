name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build & publish (e.g. v0.4.0)"
        required: true
        type: string

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: Pre-release Verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: Audit Cargo.lock
        run: |
          if grep -E 'name = "(openssl-sys|libsqlite3-sys|rusqlite|sqlite|libsql|aws-lc-sys|aws-lc-fips-sys|libyaml|webp-sys|libwebp-sys)"' rust/Cargo.lock; then
            echo "::error::Forbidden C system dependency found in rust/Cargo.lock"
            exit 1
          fi
      - name: Clippy & tests
        working-directory: rust
        run: |
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked
      - name: Installer tests
        run: python3 -m unittest scripts/install_test.py

  build:
    name: Build (${{ matrix.asset }})
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - asset: mibot-lite-linux-amd64
            os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            cc_var: CC_x86_64_unknown_linux_musl
          - asset: mibot-lite-linux-arm64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            cc_var: CC_aarch64_unknown_linux_musl
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install musl-tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends musl-tools

      - name: Install Rust toolchain & target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Build static Linux binary
        working-directory: rust
        env:
          MIBOT_VERSION: ${{ inputs.tag || github.ref_name }}
        run: |
          export "${{ matrix.cc_var }}=musl-gcc"
          cargo build --release --locked --target "${{ matrix.target }}" -p mibot-lite
          mkdir -p ../dist
          cp "target/${{ matrix.target }}/release/mibot-lite" "../dist/${{ matrix.asset }}"
          strip "../dist/${{ matrix.asset }}"
          chmod 755 "../dist/${{ matrix.asset }}"
          file "../dist/${{ matrix.asset }}"
          ! ldd "../dist/${{ matrix.asset }}" 2>&1 | grep -q 'libc\.so'
          "../dist/${{ matrix.asset }}" --version

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums.txt
        working-directory: dist
        run: |
          sha256sum mibot-lite-* > checksums.txt
          cat checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: dist/*
          generate_release_notes: true
